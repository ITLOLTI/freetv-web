name: Build FreeTV for Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]        # arm64 = Apple Silicon (M1–M4), x64 = Intel Macs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the FreeTV app inside the Mac app
        run: |
          mkdir -p desktop/app
          cp index.html *.js style.css manifest.webmanifest *.png desktop/app/

      - name: Install
        working-directory: desktop
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          npm install --no-audit --no-fund
          # the Mac app carries its own copy of the video libraries (works even if the CDN is slow)
          cp node_modules/hls.js/dist/hls.min.js node_modules/mpegts.js/dist/mpegts.js app/
          sed -i '' -e 's#https://cdn.jsdelivr.net/npm/hls.js@[^"]*#hls.min.js#' -e 's#https://cdn.jsdelivr.net/npm/mpegts.js@[^"]*#mpegts.js#' app/index.html
          grep -n "script src" app/index.html

      - name: Add the media extractor (yt-dlp) for the Web Sniffer
        run: |
          mkdir -p desktop/bin
          curl -fL --retry 3 -o desktop/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x desktop/bin/yt-dlp
          # JavaScript engine yt-dlp needs for YouTube's full quality list (1080p, 4K)
          curl -fL --retry 3 -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-apple-darwin.zip
          unzip -o deno.zip -d desktop/bin && rm deno.zip && chmod +x desktop/bin/deno
          file desktop/bin/deno
          ls -la desktop/bin

      - name: Build the .dmg
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: FreeTV-Mac-${{ matrix.arch == 'arm64' && 'AppleSilicon' || 'Intel' }}
          path: desktop/dist/*.dmg
